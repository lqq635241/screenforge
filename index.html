<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ScreenForge · 开源大屏搭建器</title>
  <meta name="description" content="ScreenForge 是一个开源可视化大屏搭建器：拖拽 ECharts 组件、一键主题换肤、自由布局，可导出单文件 HTML 或 Vue / React 工程。" />
  <meta name="theme-color" content="#080C13" />
  <meta name="color-scheme" content="dark" />
  <meta name="robots" content="index,follow" />
  <!-- 社交分享预览（不影响 Lighthouse，但被贴到群/文档里时不至于只有一条裸链接） -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="ScreenForge" />
  <meta property="og:title" content="ScreenForge · 开源大屏搭建器" />
  <meta property="og:description" content="拖拽 ECharts 组件、一键换肤、自由布局，导出单文件 HTML 或 Vue / React 工程。" />
  <meta property="og:locale" content="zh_CN" />
  <!-- 相对路径：部署在 /<仓库名>/ 子路径下也能正确解析 -->
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />

  <!--
    首屏关键样式：内联（不走外链）——保证 FCP 不等 CSS 请求。
    只在 JS 加载完成前生效的部分：body 底色 + 骨架屏。
    其余样式由 src/index.css 提供（构建时内联进 HTML，见 vite.config.ts 的 inlineCss 插件）。
  -->
  <style>
    html, body, #root { margin: 0; height: 100%; overflow: hidden; }
    body {
      background: #080C13; color: #E6ECF5;
      font: 400 13px/1.5 system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* ---- 骨架屏：仅占位，真实界面挂载后淡出移除 ---- */
    #boot {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      background: #080C13; transition: opacity .28s ease; z-index: 9999;
    }
    #boot.hide { opacity: 0; pointer-events: none; }
    .bt-bar {
      height: 52px; flex: 0 0 52px; display: flex; align-items: center; gap: 14px;
      padding: 0 16px; background: #0D131D; border-bottom: 1px solid #1C2534;
    }
    .bt-main { flex: 1; display: flex; min-height: 0; }
    .bt-left { width: 218px; flex: 0 0 218px; background: #0B1018; border-right: 1px solid #1C2534; padding: 16px 12px; }
    .bt-center { flex: 1; background: radial-gradient(circle at 1px 1px, #141B27 1px, transparent 0) 0 0 / 22px 22px, #05080F; position: relative; }
    .bt-right { width: 306px; flex: 0 0 306px; background: #0B1018; border-left: 1px solid #1C2534; padding: 16px 14px; }

    /* 骨架块：渐变扫光，暗示"正在加载"而非卡死 */
    .sk {
      border-radius: 5px; background: #16202F; border: 1px solid #1D2839;
      background-image: linear-gradient(100deg, transparent 20%, rgba(110,163,255,.11) 45%, transparent 70%);
      background-size: 220% 100%; background-repeat: no-repeat; animation: sk-sweep 1.5s ease-in-out infinite;
    }
    @keyframes sk-sweep { from { background-position: 140% 0; } to { background-position: -60% 0; } }
    @media (prefers-reduced-motion: reduce) { .sk { animation: none; } }

    .bt-brand { width: 132px; height: 16px; }
    .bt-pill { width: 54px; height: 22px; border-radius: 4px; background: #111826; }
    .bt-tile { height: 46px; margin-bottom: 8px; }
    .bt-line { height: 10px; margin-bottom: 11px; }

    /* 中心画布占位：16:9 比例，与真实画布位置接近，避免挂载后跳动 */
    .bt-canvas {
      position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
      width: min(93%, 1180px); max-height: 88%; aspect-ratio: 16 / 9; border-radius: 6px;
      background: #0A1220; border: 1px solid #16202E; box-shadow: 0 18px 60px rgba(0,0,0,.55);
      padding: 3.2% 2.6%; display: flex; flex-direction: column; gap: 2.4%;
    }
    .bt-canvas-row { display: flex; gap: 1.6%; }
    .bt-canvas-row > .sk { flex: 1; border-radius: 4px; }
    .bt-canvas-title { height: 5%; width: 34%; align-self: center; }
    .bt-h-14 { height: 14%; } .bt-h-34 { height: 34%; } .bt-h-38 { height: 38%; }

    .bt-tip {
      position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%);
      font-size: 12px; color: #6F7E96; letter-spacing: .5px; white-space: nowrap;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- 骨架屏：index.css / React 就绪后由 main.tsx 淡出移除，不进 React 树 -->
  <div id="boot" aria-hidden="true">
    <div class="bt-bar">
      <div class="sk bt-brand"></div>
      <div class="bt-pill"></div>
      <div style="flex:1"></div>
      <div class="sk bt-pill" style="width:44px"></div>
      <div class="sk bt-pill" style="width:44px"></div>
      <div class="sk bt-pill" style="width:120px"></div>
      <div class="sk bt-pill" style="width:74px"></div>
    </div>
    <div class="bt-main">
      <div class="bt-left">
        <div class="sk bt-line" style="width:36%"></div>
        <div class="sk bt-tile"></div>
        <div class="sk bt-tile"></div>
        <div class="sk bt-tile"></div>
        <div class="sk bt-line" style="width:30%;margin-top:18px"></div>
        <div class="sk bt-tile"></div>
        <div class="sk bt-tile"></div>
        <div class="sk bt-tile"></div>
      </div>
      <div class="bt-center">
        <div class="bt-canvas">
          <div class="sk bt-canvas-title"></div>
          <div class="bt-canvas-row bt-h-14">
            <div class="sk"></div><div class="sk"></div><div class="sk"></div><div class="sk"></div>
          </div>
          <div class="bt-canvas-row bt-h-34">
            <div class="sk" style="flex:2.2"></div><div class="sk" style="flex:1"></div>
          </div>
          <div class="bt-canvas-row bt-h-38">
            <div class="sk" style="flex:1.3"></div><div class="sk"></div><div class="sk"></div>
          </div>
        </div>
        <div class="bt-tip">正在准备画布与图表引擎…</div>
      </div>
      <div class="bt-right">
        <div class="sk bt-line" style="width:52%;height:12px;margin-bottom:16px"></div>
        <div class="sk bt-line" style="width:100%"></div>
        <div class="sk bt-line" style="width:78%"></div>
        <div class="sk bt-line" style="width:64%"></div>
        <div class="sk bt-line" style="width:88%;margin-top:18px"></div>
        <div class="sk bt-line" style="width:70%"></div>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
